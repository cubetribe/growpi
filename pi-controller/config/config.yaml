# GrowPi Controller Configuration
# ================================
# Hardware: Raspberry Pi 3B+
# Hostname: growpi
# IP: <PI_HOST>
#
# PIN BELEGUNG (FINAL - ACTIVE 2026-02-03):
# -----------------------------------------
# Kanal 1: Far Red     -> GPIO 16 -> Pin 36
# Kanal 2: Warm White  -> GPIO 13 -> Pin 33
# Kanal 3: Cool White  -> GPIO 18 -> Pin 12
# Kanal 4: UV          -> GPIO 12 -> Pin 32
# -----------------------------------------

lamps:
  update_interval: 1

  channels:
    # Kanal 1: Far Red (GPIO 16 / Pin 36)
    - channel: 1
      name: "Far Red"
      gpio_pin: 16
      pwm_frequency: 1000
      default_intensity: 10

    # Kanal 2: Warm White (GPIO 13 / Pin 33)
    - channel: 2
      name: "Warm White"
      gpio_pin: 13
      pwm_frequency: 1000
      default_intensity: 10

    # Kanal 3: Cool White (GPIO 18 / Pin 12)
    - channel: 3
      name: "Cool White"
      gpio_pin: 18
      pwm_frequency: 1000
      default_intensity: 10

    # Kanal 4: UV (GPIO 12 / Pin 32)
    - channel: 4
      name: "UV"
      gpio_pin: 12
      pwm_frequency: 1000
      default_intensity: 0

logging:
  level: "INFO"

