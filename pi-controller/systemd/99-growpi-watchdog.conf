# Install to: /etc/systemd/system.conf.d/99-growpi-watchdog.conf
#
# Manager-level watchdog for host protection:
# - RuntimeWatchdogSec: reboots the host if PID 1 cannot refresh /dev/watchdog
# - RebootWatchdogSec: keeps watchdog active during shutdown/reboot path
#
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
