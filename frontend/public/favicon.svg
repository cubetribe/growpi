<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Leaf shape -->
  <path d="M 50 10 Q 70 30, 75 50 Q 70 70, 50 90 Q 30 70, 25 50 Q 30 30, 50 10 Z"
        fill="url(#leafGradient)"
        stroke="#00ff88"
        stroke-width="2"/>

  <!-- Leaf vein -->
  <line x1="50" y1="15" x2="50" y2="85"
        stroke="#00dd77"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Side veins -->
  <path d="M 50 30 Q 60 40, 65 50"
        stroke="#00dd77"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"/>
  <path d="M 50 30 Q 40 40, 35 50"
        stroke="#00dd77"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"/>
  <path d="M 50 60 Q 60 65, 68 70"
        stroke="#00dd77"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"/>
  <path d="M 50 60 Q 40 65, 32 70"
        stroke="#00dd77"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"/>
</svg>
